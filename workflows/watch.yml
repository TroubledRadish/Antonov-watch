name: antonov-watch

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum interval)
  workflow_dispatch: {}      # lets you trigger a run by hand to test

permissions:
  contents: write            # needed to commit the updated state file

concurrency:
  group: antonov-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll adsb.fi and push on transition
        env:
          ADSB_HEX: "50801b"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE_FILE: state.json
        run: python3 watch.py

      - name: Commit state if it changed
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name  "antonov-watch[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: update [skip ci]"
            git push
          fi
